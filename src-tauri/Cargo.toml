[package]
name = "buturepacket"
version = "0.1.0"
description = "A modern network traffic explorer."
authors = ["Pedro Buture"]
edition = "2024"
publish = false

[lib]
name = "buturepacket_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
pcap = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
etherparse = "0.19"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
